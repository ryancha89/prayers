buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        // 27.2, not the 27.1 the React Native template pins.
        //
        // The Unity export writes its own module with `ndkVersion "27.2.12479018"` hard-coded — it
        // is the version the exported IL2CPP C++ is compiled against, and Gradle compiles that
        // source itself rather than linking a prebuilt .so. Two NDK versions in one build is not a
        // thing, and Unity's is the one that cannot move. (On this machine it is also the only NDK
        // that exists: there is no ~/Library/Android/sdk, so android/local.properties points at the
        // copy inside the Unity Editor.)
        ndkVersion = "27.2.12479018"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        // Unity UaaL export ships prebuilt .aar files in unityLibrary/libs.
        def unityLibs = new File(rootDir, '../unity/builds/android/unityLibrary/libs')
        if (unityLibs.exists()) {
            flatDir { dirs unityLibs.absolutePath }
        }
    }
}
